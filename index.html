<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizarra Deportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF2F1; --panel:#FFFFFF; --ink:#16302C; --muted:#5B706C; --line:#D3DDDA;
  --brand:#1F5F55; --brand-soft:#D9EAE5;
  --ok:#2E7D4F; --ok-bg:#D8EFDF; --warn:#9A6A00; --warn-bg:#FBEBC4; --bad:#B23A30; --bad-bg:#F7DAD6;
  --warn-fill:#D9A21B;
  --cell-empty:#F4F7F6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101816; --panel:#17221F; --ink:#E4EEEB; --muted:#96AAA5; --line:#2A3A36;
    --brand:#6FC2B0; --brand-soft:#1E3632;
    --ok:#7FD39C; --ok-bg:#1C3727; --warn:#F0C45A; --warn-bg:#3A2F12; --bad:#F2877D; --bad-bg:#3E1E1B;
    --warn-fill:#D9A21B;
    --cell-empty:#1B2724;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101816; --panel:#17221F; --ink:#E4EEEB; --muted:#96AAA5; --line:#2A3A36;
  --brand:#6FC2B0; --brand-soft:#1E3632;
  --ok:#7FD39C; --ok-bg:#1C3727; --warn:#F0C45A; --warn-bg:#3A2F12; --bad:#F2877D; --bad-bg:#3E1E1B;
  --warn-fill:#D9A21B;
  --cell-empty:#1B2724;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* estructura: barra lateral + contenido */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;max-width:1480px;margin:0 auto;padding:20px 18px 48px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 10px 12px}
.side-head{padding:2px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side-head strong{display:block;font:700 1.3rem/1.1 "Barlow Semi Condensed",Barlow,sans-serif;margin-top:2px}
.eyebrow{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sgroup{margin:14px 8px 4px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sitem{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left;color:var(--ink);font-size:.95rem;line-height:1.25}
.sitem:hover{background:var(--brand-soft)}
.sitem[aria-current="page"]{background:var(--brand);color:var(--panel)}
.sitem.home{font-weight:600}
.sitem .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sitem .dot.none{background:transparent!important;border:1.5px solid var(--line)}
.sitem[aria-current="page"] .dot{box-shadow:0 0 0 2px var(--panel)}
.sitem .sname{flex:1;min-width:0}
.sitem .sval{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.sitem[aria-current="page"] .sval{color:var(--panel);opacity:.85}
.navtoggle{display:none}
.main{min-width:0}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top p{margin:2px 0 0;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:16px}
nav.tabs:empty{display:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font:600 1rem "Barlow Semi Condensed",Barlow,sans-serif;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px 40px}
  .side{position:static;max-height:none;padding:6px}
  .side-head{display:none}
  .navtoggle{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--ink);text-align:left}
  .navtoggle strong{font:600 1.05rem "Barlow Semi Condensed",Barlow,sans-serif}
  .navtoggle .chev{font-size:.85rem;color:var(--muted)}
  .side-nav{display:none;padding:4px 4px 6px;border-top:1px solid var(--line);margin-top:4px}
  .side.open .side-nav{display:block}
  h1{font-size:1.35rem}
}

.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0E1A17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1A17}}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn.danger{background:var(--bad);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:12px}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.drop{border:2px dashed var(--brand);border-radius:10px;padding:34px 18px;text-align:center;background:var(--brand-soft);cursor:pointer}
.drop strong{display:block;font:600 1.15rem "Barlow Semi Condensed",sans-serif}
.drop span{color:var(--muted)}
.drop.over{background:var(--panel)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:4px;margin:12px 0;font-size:.93rem}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.note.ok{border-color:var(--ok);background:var(--ok-bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
label.f input,label.f select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:140px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.82rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pz th.name,.pz td.name{position:sticky;left:0;background:var(--panel);z-index:1;min-width:150px}
.pz td.cell{text-align:center;font-variant-numeric:tabular-nums;border-left:2px solid var(--panel);min-width:62px}
.pz td.cell.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.pz td.cell.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.pz td.cell.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.pz td.cell.empty{background:var(--cell-empty);color:var(--muted)}
.pz td.cell.month{border-left:3px solid var(--ink)}
.pz tr.sub td{font-weight:600;border-top:2px solid var(--ink)}
.pz tr.total td{font-weight:700;border-top:3px double var(--ink)}
.pz tr.sh td{font:700 .8rem Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);padding-top:16px;border-bottom:2px solid var(--brand)}
.pz th.mh{text-align:center;color:var(--ink);border-bottom:0}
.pz th.wk{text-align:center;font-weight:500}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.bar{height:10px;background:var(--cell-empty);border-radius:5px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--brand)}
.g-ok{background:var(--ok)!important}.g-warn{background:var(--warn-fill)!important}.g-bad{background:var(--bad)!important}.g-empty{background:var(--line)!important}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-empty{color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--brand);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--brand);font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--panel)}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state .row{justify-content:center;margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.status{font-size:.82rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
input.inl{width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
input.inl.wide{width:100%;min-width:220px}
select.inl{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-start;padding:14px 18px}
.fgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--ink);line-height:1.3}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--panel)}
.chip .sub{font-weight:500;opacity:.75;font-size:.8rem;margin-left:4px}
.stepper{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.stepper button{border:1.5px solid var(--line);background:var(--panel);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;line-height:1;color:var(--ink)}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);height:34px;color:var(--ink)}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--cell-empty);min-width:120px;margin:6px 0 4px}
.sbar i{display:block;height:100%}
.semleg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.semleg b{font-weight:600}
tr.det td{background:var(--cell-empty)}
.clslist{display:flex;flex-wrap:wrap;gap:6px 16px;padding:2px 0 4px 8px}
.cls{white-space:nowrap;font-size:.88rem}
.stepper select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0;max-width:240px;height:34px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font:700 1.75rem/1.15 "Barlow Semi Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi span{font-size:.82rem;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel);cursor:pointer;color:var(--ink)}
.bcard:hover{border-color:var(--brand);background:var(--brand-soft)}
.bcard .bl{font:600 1.1rem "Barlow Semi Condensed",Barlow,sans-serif}
.bcard .bs{font-size:.82rem;color:var(--muted)}
.bcard b{font:700 1.6rem/1.1 "Barlow Semi Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.bcard .tag{align-self:flex-start;margin-top:4px}
.meter{position:relative;height:10px;background:var(--cell-empty);border-radius:5px;margin:6px 0 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.meter b{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px solid var(--ink);margin:0}
.section-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.pending-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ranking */
.rk-list{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:34px minmax(130px,220px) 1fr 104px;gap:6px 14px;align-items:center;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
button.rk:hover{background:var(--brand-soft)}
.rk .pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .95rem "Barlow Semi Condensed",Barlow,sans-serif;background:var(--cell-empty);color:var(--muted);font-variant-numeric:tabular-nums}
.rk .pos.top{background:var(--brand);color:var(--panel)}
.rk .who strong{display:block;font-weight:600}
.rk .who span{font-size:.8rem;color:var(--muted)}
.rk .track{position:relative;height:22px;background:var(--cell-empty);border-radius:4px}
.rk .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.rk .track .mk{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
.rk .val{text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.rk .val b{font:700 1.3rem "Barlow Semi Condensed",Barlow,sans-serif}
.rk .val span{display:block;font-size:.78rem;color:var(--muted)}
.rk-axis{cursor:default;padding-top:0;padding-bottom:4px}
.rk-axis .track{background:none;height:16px}
.rk-axis em{position:absolute;top:0;transform:translateX(-50%);font-size:.72rem;font-style:normal;color:var(--muted);white-space:nowrap}
.rk-axis em.m{color:var(--ink);font-weight:600}
@media (max-width:640px){
  .rk{grid-template-columns:30px 1fr 84px}
  .rk .track{grid-column:2/4;grid-row:2}
  .rk-axis .who,.rk-axis .val{display:none}
}

/* gráfica por colaborador */
.vchart{position:relative;display:flex;gap:6px;height:240px;padding-top:20px}
.vcol{flex:1 1 0;min-width:40px;display:flex;flex-direction:column}
.vwrap{flex:1;position:relative;border-bottom:1px solid var(--line)}
.vwrap i{position:absolute;bottom:0;left:14%;right:14%;border-radius:3px 3px 0 0;min-height:2px}
.vwrap i span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:600;white-space:nowrap;padding-bottom:2px;color:var(--ink);font-variant-numeric:tabular-nums}
.vchart.dense .vwrap i span{display:none}
.vlab{height:22px;line-height:22px;font-size:.72rem;color:var(--muted);text-align:center;white-space:nowrap}
.vmeta{position:absolute;left:0;right:0;bottom:calc(22px + (100% - 42px) * var(--m));border-top:2px dashed var(--ink);pointer-events:none;z-index:1}
.vmeta span{position:absolute;right:0;bottom:2px;font-size:.72rem;font-weight:600;background:var(--panel);padding:0 4px}
.colhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.colhead h2{font-size:1.6rem}
.colhead .meta-line{color:var(--muted);font-size:.9rem;margin-top:2px}
.rankpill{display:flex;gap:8px;flex-wrap:wrap}
.rankpill span{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.88rem}
.rankpill span b{font:700 1.15rem "Barlow Semi Condensed",Barlow,sans-serif}

@media (max-width:600px){.filters{gap:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- utilidades ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
function tidy(s){return String(s==null?"":s).replace(/\s+/g," ").trim()}
function titleCase(s){return tidy(s).toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(v){if(v==null||v==="")return 0;if(typeof v==="number")return isFinite(v)?v:0;const n=parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(/,/g,""));return isFinite(n)?n:0}
function pct(v,d=0){return v==null||!isFinite(v)?"–":(v*100).toFixed(d)+"%"}
function fmtN(n){return Math.round(n||0).toLocaleString("es-MX")}
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
function fmtShort(s){const d=parseISO(s);return d.getDate()+" "+MESES[d.getMonth()].slice(0,3)}
function monthKey(s){return s.slice(0,7)}
function monthLabel(k){const [y,m]=k.split("-");return MESES[+m-1].charAt(0).toUpperCase()+MESES[+m-1].slice(1)+" "+y}
function toDate(v){
  if(v instanceof Date&&!isNaN(v))return v;
  if(typeof v==="number"&&v>20000&&v<80000){return new Date(Math.round((v-25569)*86400000)+new Date().getTimezoneOffset()*60000)}
  if(typeof v==="string"){const m=v.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}
    const m2=v.match(/(\d{4})-(\d{2})-(\d{2})/);if(m2)return new Date(+m2[1],+m2[2]-1,+m2[3])}
  return null;
}
function spanDays(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000)+1}

function L(a){
  const id=a||state.area, ar=areaById(id), est=ar&&ar.grupo==="estudios";
  const base=est
    ?{persona:"Instructor",personas:"instructores",cap:"Aforo",ocup:"% aforo ocupado",ocupado:"ocupado",equipo:"Instructores y metas",at:"Atendidos",atl:"atendidos"}
    :{persona:"Colaborador",personas:"colaboradores",cap:"Agenda 100%",ocup:"% agenda ocupada",ocupado:"ocupada",equipo:"Equipo y metas",at:"Atendidos",atl:"atendidos"};
  if(est)Object.assign(base,{at:"Asistentes",atl:"asistentes"});
  const modo=ar?cfgOf(id).modo:"ocupacion";
  if(modo==="capacidad")return Object.assign(base,{capfija:true,cap:"Capacidad"});
  if(modo==="cartera")return Object.assign(base,{cartera:true,persona:"Coach",personas:"coaches"});
  if(modo==="cantidad"||modo==="promedio"){

    return Object.assign(base,{qty:true,prom:modo==="promedio",cap:"Meta ("+u+(modo==="promedio"?" por clase":"")+")",ocup:"% de la meta",ocupado:"de la meta",at:u.charAt(0).toUpperCase()+u.slice(1),atl:u});
  }

}
function fixConfig(c,area){
  if(!c||!Array.isArray(c.roster))c={roster:area==="recovery"?clone(RECOVERY_ROSTER):[]};
  c.roster=c.roster.map(r=>Object.assign({sucursal:"NAC",turno:"MAT",meta:0.9,alias:[]},r));
  c.extra=c.extra||{}; c.tiers=c.tiers||clone(DEFAULT_TIERS);
  if(!c.modo)c.modo=area==="fuerza"?"cartera":(area==="recovery"||area==="nutricion")?"capacidad":(area==="mobility"||area==="fullevo"||area==="core")?"accesos":area==="tutoriales"?"ingresos":"ocupacion";
  // Mobility / Full Evolution / Core: % de los socios que van a fuerza que pasan por el área
  if(c.metaAcc==null)c.metaAcc=area==="mobility"?0.8:0.3;
  if(!Array.isArray(c.sucs))c.sucs=area==="fullevo"?["VR"]:area==="core"?["NAC"]:["NAC","GOU","VR"];
  if(c.metaIng==null)c.metaIng=26000;
  // capacidad fija por semana (Recovery: 27 h = 96, 40 h = 141 · Nutrición: 57 citas) y meta por turno
  if(c.capDef==null)c.capDef=area==="recovery"?96:area==="nutricion"?57:0;
  if(!c.capJornada)c.capJornada=area==="recovery"?{"40":141,"27":96}:{};
  if(!c.metaPct)c.metaPct=area==="recovery"?{MAT:0.9,VES:0.85}:area==="nutricion"?{MAT:0.8,VES:0.7}:{};
  // Coach de Fuerza: cartera de 100 socios, 90% con rutina, 95% activos, 2 testimonios al mes
  c.kpi=Object.assign({cartera:100,rutina:0.9,activos:0.95,testimonios:2},c.kpi||{});
  c.metasTurno=c.metasTurno||{}; c.cupos=c.cupos||{}; c.semaforo=c.semaforo||{};
  // meta con la que entran los nuevos (en estudios: % de aforo)
  if(c.metaDef==null)c.metaDef=areaById(area)&&areaById(area).grupo==="estudios"?0.8:0.9;
  return c;
}
// meta mensual en número de una persona: la suya propia o la de su sucursal y turno
function goalOf(r,cfg){if(r.metaN!=null&&r.metaN!=="")return +r.metaN;const v=cfg.metasTurno[r.sucursal+"|"+r.turno];return v==null||v===""?null:+v}
function monthFrac(ini,fin){if(!ini||!fin||isFullMonth(ini,fin))return 1;return spanDays(ini,fin)/30.44}
function capSemOf(r,cfg){
  if(r&&r.capSem!=null&&r.capSem!=="")return +r.capSem||0;
  const j=r&&r.jornada?cfg.capJornada[r.jornada]:null;return +(j||cfg.capDef)||0;
}
// reparto de la capacidad semanal por día (0 = domingo) según día de descanso, jornada y horas de fin de semana
function fraccionDia(r){
  if(!r||r.descanso==null||r.descanso==="")return null;
  const jor=+r.jornada||0, hfs=r.horasFin!=null&&r.horasFin!==""?+r.horasFin:(jor===40?5:null);
  // "fin": descansa uno de los dos días del fin de semana; trabaja el otro (se reparte mitad sábado, mitad domingo)
  if(r.descanso==="fin"){
    const h=Array(7).fill(0);
    if(jor&&hfs!=null){for(let d=1;d<=5;d++)h[d]=Math.max(0,jor-hfs)/5;h[0]=h[6]=hfs/2}
    else{for(let d=1;d<=5;d++)h[d]=1;h[0]=h[6]=0.5}
    const tot=h.reduce((a,b)=>a+b,0);return h.map(x=>x/tot);
  }
  const desc=+r.descanso, work=[0,1,2,3,4,5,6].filter(d=>d!==desc), fin=work.filter(d=>d===0||d===6), sem=work.filter(d=>d>=1&&d<=5), h=Array(7).fill(0);
  if(jor&&hfs!=null&&sem.length){fin.forEach(d=>h[d]=hfs);sem.forEach(d=>h[d]=Math.max(0,jor-hfs*fin.length)/sem.length)}
  else work.forEach(d=>h[d]=1);
  const tot=h.reduce((a,b)=>a+b,0);return tot>0?h.map(x=>x/tot):null;
}
// capacidad de un periodo: día por día si tiene descanso definido; si no, promedio semanal
function capPeriodo(r,cfg,ini,fin){
  const cs=capSemOf(r,cfg);if(!cs)return 0;
  const fr=fraccionDia(r);if(!fr)return cs*spanDays(ini,fin)/7;
  let t=0;for(let d=parseISO(ini);iso(d)<=fin;d=addDays(d,1))t+=cs*fr[d.getDay()];return t;
}
function horarioTxt(r){
  if(!r||r.descanso==null||r.descanso==="")return"";
  const jor=+r.jornada||0;
  if(r.descanso==="fin")return (jor?jor+" h · ":"")+"descansa un día del fin de semana"+(jor===40?" · el otro cubre "+(r.horasFin||5)+" h":"");
  return (jor?jor+" h · ":"")+"descansa "+DIAS_LARGO[+r.descanso].toLowerCase()+(jor===40?" · fin de semana "+(r.horasFin||5)+" h":"");
}
const DIAS_LARGO=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
function metaTxt(r,area){const a=area||state.area,cfg=cfgOf(a);if(cfg.modo==="ocupacion")return pct(r.meta);
  if(cfg.modo==="capacidad")return pct(metaOf(r.id,a))+" de "+fmtN(capSemOf(r,cfg))+" por semana";
  if(cfg.modo==="cartera"){const k=cfg.kpi;return "cartera "+k.cartera+" · rutina "+pct(k.rutina)+" · activos "+pct(k.activos)}const g=goalOf(r,cfg);return g==null?"sin meta":fmtN(g)+" "+(cfg.modo==="promedio"?"por clase":(cfg.unidad||""))}

function horaTxt(v){
  if(v instanceof Date&&!isNaN(v))return String(v.getHours()).padStart(2,"0")+":"+String(v.getMinutes()).padStart(2,"0");
  if(typeof v==="number"&&v>=0&&v<1){const m=Math.round(v*1440);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
  const m=String(v==null?"":v).match(/(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,"0")+":"+m[2]:null;

// indicadores del coach; el excedente de cartera no cuenta: la rutina se mide sobre la cartera meta (100)
function cartScore(d,k){
  if(!d)return null;
  const has=v=>v!=null&&v!=="", base=+k.cartera||100, o={};
  o.car=has(d.cartera)?+d.cartera:null; o.rut=has(d.rutina)?+d.rutina:null;
  o.pRut=o.rut!=null?Math.min(o.rut,base)/base:null; o.pAct=has(d.activos)?+d.activos/100:null; o.tes=has(d.testimonios)?+d.testimonios:null;
  o.okCar=o.car!=null&&o.car>=base; o.okRut=o.pRut!=null&&o.pRut>=k.rutina; o.okAct=o.pAct!=null&&o.pAct>=k.activos; o.okTes=o.tes!=null&&o.tes>=k.testimonios;
  const parts=[o.car!=null?Math.min(o.car/base,1):null,o.pRut!=null?Math.min(o.pRut/k.rutina,1):null,o.pAct!=null?Math.min(o.pAct/k.activos,1):null].filter(v=>v!=null);
  o.n=parts.length; o.score=parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:null;
  o.metas=[o.okCar,o.okRut,o.okAct].filter(Boolean).length; o.cumple=o.metas===3;
  if(!o.n&&o.tes==null)return null;
  return o;
}

function viewTableroCartera(){

function accStats(area,opts){
  opts=opts||{};
  const cfg=cfgOf(area), pf=state.global.pctFuerza, rg=opts.range!==undefined?opts.range:curRange();
  const sucs=cfg.sucs.filter(s=>(opts.suc||state.f.suc)==="all"||s===(opts.suc||state.f.suc));
  if(state.f.rango!=="acum"&&opts.range===undefined&&!rg)return{acc:0,base:0,meta:0,real:0,dias:[]};
  const o={acc:0,base:0,meta:0,real:0,dias:[]};
  for(const [d,v] of Object.entries(diaDias()).sort()){
    if(rg&&(d<rg.from||d>rg.to))continue;
    for(const s of sucs){
      const acc=v.acc&&v.acc[s], real=v[area]&&v[area][s];
      if(acc==null||acc===""||real==null||real==="")continue;
      const base=+acc*(pf[s]||0), meta=base*cfg.metaAcc;

    }

  return o;
}

// Supabase con la misma forma que la base del artefacto: tabla deportes_docs (col, id, data)
function supaDb(url,key){
  const sb=window.supabase.createClient(url,key), T="deportes_docs", subs={}, cache={};
  const emit=col=>{const m=cache[col]||new Map(), snap={docs:[...m].map(([id,d])=>({id,data:()=>d}))};(subs[col]||[]).forEach(x=>x.cb(snap))};
  const load=async col=>{
    const out=new Map();
    for(let from=0;;from+=1000){const {data,error}=await sb.from(T).select("id,data").eq("col",col).range(from,from+999);if(error)throw error;data.forEach(r=>out.set(r.id,r.data));if(data.length<1000)break}
    cache[col]=out;emit(col);
  };
  sb.channel("deportes_docs").on("postgres_changes",{event:"*",schema:"public",table:T},p=>{
    const r=p.eventType==="DELETE"?p.old:p.new, col=r&&r.col;if(!col||!cache[col])return;
    if(p.eventType==="DELETE")cache[col].delete(r.id);else cache[col].set(r.id,r.data);emit(col);
  }).subscribe();
  // respaldo por si el tiempo real se corta
  setInterval(()=>{for(const col of Object.keys(subs))load(col).catch(()=>{})},90000);
  return{
    collection:col=>({onSnapshot:(cb,err)=>{const x={cb};(subs[col]=subs[col]||[]).push(x);load(col).catch(e=>err&&err({message:e.message||String(e)}));return()=>{subs[col]=subs[col].filter(y=>y!==x)}}}),
    doc:path=>{const [col,id]=path.split("/");return{
      set:async d=>{const {error}=await sb.from(T).upsert({col,id,data:d,updated_at:new Date().toISOString()});if(error)throw error;(cache[col]=cache[col]||new Map()).set(id,d);emit(col)},
      delete:async()=>{const {error}=await sb.from(T).delete().eq("col",col).eq("id",id);if(error)throw error;if(cache[col]){cache[col].delete(id);emit(col)}}}}
  };
}

/* ---------- lectura del export ---------- */
function mapColumns(headerRow){
  const map={}; const used=new Set();
  const cells=headerRow.map(norm);
  for(const pass of ["exact","includes"]){
    for(const f of Object.keys(SYN)){
      if(map[f]!=null)continue;
      for(let j=0;j<cells.length;j++){
        const h=cells[j]; if(!h||used.has(j))continue;
        if((f==="completadas"||f==="target")&&/[\/%]/.test(h))continue;
        if(f==="sucursal"&&/^id/.test(h))continue;
        const hit=RX_FIELD[f]?RX_FIELD[f].test(h):SYN[f].some(s=>pass==="exact"?h===s:h.includes(s));
        if(hit){map[f]=j;used.add(j);break}
      }
    }
  }
  return map;
}
function detectHeader(aoa){
  let best=null;
  for(let i=0;i<Math.min(25,aoa.length);i++){
    const m=mapColumns(aoa[i]||[]); const score=Object.keys(m).length;
    if(m.tecnico!=null&&m.completadas!=null&&(!best||score>best.score))best={i,map:m,score};
  }
  return best;
}
function parseFilters(text){
  const out={texto:text};
  const a=text.match(/despu[eé]s del (\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  const b=text.match(/antes del (\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  if(a)out.inicio=iso(new Date(+a[3],+a[2]-1,+a[1]));
  if(b)out.fin=iso(addDays(new Date(+b[3],+b[2]-1,+b[1]),-1));
  const c=text.match(/nombre es ([^\n]+)/i); if(c)out.centro=c[1].trim();
  const r=text.match(/Rol es ([^\n]+)/i); if(r)out.rol=r[1].trim();
  return out;
}
function extractRows(aoa,hi,map){
  const rows=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]||[]; const t=r[map.tecnico];
    if(t==null||tidy(t)==="")continue;
    if(/^filtros/i.test(String(t)))continue;
    const row={t:tidy(t),c:num(r[map.completadas])};
    if(map.target!=null)row.g=num(r[map.target]);
    if(map.agendados!=null)row.a=num(r[map.agendados]);
    if(map.tarea!=null&&r[map.tarea]!=null)row.ta=tidy(r[map.tarea]);
    if(map.fecha!=null){const d=toDate(r[map.fecha]);if(d)row.f=iso(d)}
    if(map.inicio!=null&&map.fin!=null){
      const a=toDate(r[map.inicio]), b=toDate(r[map.fin]);
      if(a&&b){let pi=iso(a),pf=iso(b);
        // "del 1 sep al 1 oct" como en los filtros de TG: el fin es exclusivo
        if(pi.slice(8)==="01"&&pf.slice(8)==="01"&&pf>pi)pf=iso(addDays(parseISO(pf),-1));
        if(pf>=pi){row.pi=pi;row.pf=pf}}
    }
    if(map.sucursal!=null){const s=detectSuc(r[map.sucursal]);if(s)row.su=s}
    if(map.sala!=null){row.sa=tidy(r[map.sala]);
      if(map.hora!=null){const h=horaTxt(r[map.hora]);if(h)row.h=h}
      if(map.estado!=null)row.v=/valid/.test(norm(r[map.estado]))?1:0}
    rows.push(row);
  }
  return rows;
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  let filterText="", found=null, firstAoa=null, sheetName=null;
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    for(const r of aoa)for(const c of r)if(typeof c==="string"&&/filtros aplicados/i.test(c))filterText+=c+"\n";
    if(!firstAoa&&aoa.some(r=>r.some(c=>c!=null)))firstAoa=aoa, sheetName=name;
    if(!found){const h=detectHeader(aoa);if(h){found={aoa,h,name}}}
  }
  const p={fileName:file.name, area:state.area==="resumen"?"deportes":state.area, filtros:parseFilters(filterText), assign:{}};
  const auto=detectSuc(p.filtros.centro||"")||detectSuc(file.name);
  p.sucursal=auto||(state.f.suc!=="all"?state.f.suc:"NAC"); p.sucAuto=!!auto;
  if(!found){
    p.aoa=firstAoa; p.sheet=sheetName;
    const cells=firstAoa?firstAoa.reduce((n,r)=>n+r.filter(c=>c!=null).length,0):0;
    p.error=cells<4
      ? "El archivo no trae datos, solo el aviso de conexión a Power BI. En TrainingGym exporta con la opción de datos (Datos resumidos, .xlsx o .csv), no la vista conectada."
      : "No encontré las columnas de técnico y completadas. Puedes intentar ordenarlo con IA.";
    return p;
  }
  return finishPending(p,found.aoa,found.h.i,found.h.map,found.name);
}
function finishPending(p,aoa,hi,map,sheet){
  p.sheet=sheet; p.map=map; p.headers=(aoa[hi]||[]).map(tidy);
  p.rows=extractRows(aoa,hi,map);
  p.hasFecha=p.rows.some(r=>r.f);
  p.hasRango=p.rows.some(r=>!r.f&&r.pi);
  p.sinFecha=p.rows.filter(r=>!r.f&&!r.pi&&norm(r.t)!=="total").length;
  p.rowSuc=p.rows.some(r=>r.su);
  // reporte de clases (trae Sala): se reparte por sala a los estudios, venga de donde venga
  p.clases=p.rows.some(r=>r.sa!=null); if(p.clases)p.area="deportes";
  if(!p.rows.length){p.error="Encontré los encabezados pero ninguna fila con datos.";return p}
  delete p.error;
  if(p.hasFecha){
    const fs=p.rows.filter(r=>r.f).map(r=>r.f).sort();
    p.inicio=fs[0]; p.fin=fs[fs.length-1];
  }else if(p.hasRango&&!p.filtros.inicio){
    const is=p.rows.filter(r=>r.pi).map(r=>r.pi).sort(), fs=p.rows.filter(r=>r.pf).map(r=>r.pf).sort();
    p.inicio=is[0]; p.fin=fs[fs.length-1];
  }else{
    p.inicio=p.filtros.inicio||iso(monday(new Date()));
    p.fin=p.filtros.fin||iso(addDays(parseISO(p.inicio),6));
  }
  return p;
}

let _facts={ref:null,val:[]};
function facts(){
  if(_facts.ref===state.periods)return _facts.val;
  const out=[];
  for(const p of state.periods){
    const psu=p.sucursal||"NAC", area=p.area||"recovery";
    for(const r of p.rows||[]){
      const su=r.su||psu;
      if(r.f){const w=iso(monday(parseISO(r.f)));out.push({r,area,su,f:r.f,ini:w,fin:iso(addDays(parseISO(w),6))})}
      else if(r.pi&&r.pf)out.push({r,area,su,f:null,ini:r.pi,fin:r.pf});
      else out.push({r,area,su,f:null,ini:p.inicio,fin:p.fin});
    }
  }
  _facts={ref:state.periods,val:out};
  return out;
}
function curAreaScope(){return state.area==="resumen"?"all":state.area}
function sucOk(x,s){return s==="all"||x.su===s}
function areaOk(x,a){return a==="all"||x.area===a}
function rangeFor(rango,v){
  if(rango==="acum"||!v)return null;
  if(rango==="mes"){const [y,m]=v.split("-").map(Number);return{kind:"mes",from:v+"-01",to:iso(new Date(y,m,0))}}
  if(rango==="semana")return{kind:"semana",from:v,to:iso(addDays(parseISO(v),6))};
  if(rango==="fechas"){const [a,b]=v.split("|");return a&&b?{kind:"fechas",from:a<=b?a:b,to:a<=b?b:a}:null}
  return{kind:"dia",from:v,to:v};
}
function inRange(x,rg){
  if(!rg)return true;
  if(x.f)return x.f>=rg.from&&x.f<=rg.to;
  if(rg.kind==="dia")return false;
  // sin fecha por fila: semanas se ubican por su inicio; periodos largos solo si caben completos
  return spanDays(x.ini,x.fin)<=7?(x.ini>=rg.from&&x.ini<=rg.to):(x.ini>=rg.from&&x.fin<=rg.to);
}
function dateOptions(suc,area){
  suc=suc||state.f.suc; area=area||curAreaScope();
  const mes=new Set(),sem=new Set(),dia=new Set();
  for(const x of facts()){
    if(!sucOk(x,suc)||!areaOk(x,area))continue;
    if(x.f){dia.add(x.f);sem.add(x.ini);mes.add(monthKey(x.f))}
    else if(spanDays(x.ini,x.fin)<=7){sem.add(iso(monday(parseISO(x.ini))));mes.add(monthKey(x.ini))}
    else if(monthKey(x.ini)===monthKey(x.fin))mes.add(monthKey(x.ini));
  }
  if(area==="all"||esAccesos(area))for(const [d,v] of Object.entries(diaDias())){if(area!=="all"&&!diaTiene(v,area))continue;dia.add(d);sem.add(iso(monday(parseISO(d))));mes.add(monthKey(d))}
  return{mes:[...mes].sort(),semana:[...sem].sort(),dia:[...dia].sort()};
}
function syncFilter(){
  const f=state.f;
  if(f.suc!=="all"&&!sucById(f.suc))f.suc="all";
  const ops=dateOptions();
  for(const k of ["mes","semana","dia"]){const l=ops[k];if(!l.includes(f.valor[k]))f.valor[k]=l.length?l[l.length-1]:null}
  if(!f.valor.fechas){const d=dateBounds();if(d.a)f.valor.fechas=d.a+"|"+d.b}
}
// primera y última fecha con datos en la vista actual
function dateBounds(){let a=null,b=null;for(const x of facts()){if(!sucOk(x,state.f.suc)||!areaOk(x,curAreaScope()))continue;const i=x.f||x.ini,e=x.f||x.fin;if(!a||i<a)a=i;if(!b||e>b)b=e}
  const sc=curAreaScope();if(sc==="all"||esAccesos(sc))for(const [d,v] of Object.entries(diaDias())){if(sc!=="all"&&!diaTiene(v,sc))continue;if(!a||d<a)a=d;if(!b||d>b)b=d}
  return{a,b}}
function curRange(){return rangeFor(state.f.rango,state.f.valor[state.f.rango])}
function selRows(opts){
  opts=opts||{};
  const suc=opts.suc||state.f.suc, area=opts.area||curAreaScope();
  const rg=opts.range!==undefined?opts.range:curRange();
  if(state.f.rango!=="acum"&&opts.range===undefined&&!rg)return [];

    &&(x.r.h==null||((!hd||x.r.h>=hd)&&(!hh||x.r.h<=hh))));

// turno de una clase por su hora: matutino 5:00–12:30, vespertino 17:00–21:00 (corte a las 15:00)
function claseTurno(r){return r.h==null?null:r.h<"15:00"?"MAT":"VES"}
function esEstudio(area){const a=areaById(area);return !!a&&a.grupo==="estudios"}
function rosterSel(opts){

function valLabel(rango,v){
  if(!v)return"";
  if(rango==="mes")return monthLabel(v);
  if(rango==="semana"){const fin=iso(addDays(parseISO(v),6));return fmtShort(v)+" – "+fmtShort(fin)+" "+fin.slice(0,4)}
  if(rango==="fechas"){const [a,b]=v.split("|");return a&&b?fmtShort(a)+" – "+fmtShort(b)+" "+b.slice(0,4):""}
  const d=parseISO(v);return DIAS[d.getDay()]+" "+fmtShort(v)+" "+v.slice(0,4);
}
function rangeLabel(){const f=state.f;return f.rango==="acum"?"Acumulado":valLabel(f.rango,f.valor[f.rango])||"Sin periodo"}
function scopeLabel(){return state.f.suc==="all"?"Vivo 47":sucNombre(state.f.suc)}
function turnoLabel(){return state.f.turno==="all"?"Todos los turnos":TURNOS[state.f.turno]}

/* ---------- cálculo ---------- */
// a qué área pertenece un nombre del export de Deportes: primero coincidencias completas, luego por primer nombre
function routeName(raw,su){
  const n=norm(raw);
  if(!n||n==="total")return{kind:"skip"};
  if(state.global.extra[n]==="__ignorar")return{kind:"skip",ignored:true};
  // los estudios se llenan con el reporte de clases (por sala), no por nombre
  for(const strict of [true,false])for(const a of AREAS.filter(a=>a.grupo==="areas")){
    const r=resolveName(raw,cfgOf(a.id),su,strict);
    if(r.kind==="col")return{kind:"col",area:a.id,id:r.id};
  }
  for(const a of AREAS)if(cfgOf(a.id).extra[n]==="__recurso")return{kind:"recurso",area:a.id};
  if(RECURSO_RE.test(n))return{kind:"recurso",area:"recovery"};
  return{kind:"otro"};
}
function resolveName(raw,cfg,su,strict){
  const n=norm(raw);
  if(!n||n==="total")return {kind:"skip"};
  if(cfg.extra&&cfg.extra[n]){const v=cfg.extra[n];
    if(v==="__recurso")return{kind:"recurso"}; if(v==="__ignorar")return{kind:"skip"};
    if(cfg.roster.some(c=>c.id===v))return{kind:"col",id:v};}
  const toks=n.split(" ");
  const pool=cfg.roster.filter(c=>!su||(c.sucursal||"NAC")===su);
  for(const c of pool){
    for(const a of c.alias||[]){
      const an=norm(a); if(!an)continue;
      if(an===n)return{kind:"col",id:c.id};
      const at=an.split(" ");
      if(at.length>1&&at.every(t=>toks.includes(t)))return{kind:"col",id:c.id};
      if(!strict&&at.length===1&&toks[0]===at[0])return{kind:"col",id:c.id};
    }
  }
  if(RECURSO_RE.test(n))return{kind:"recurso"};
  return{kind:"otro"};
}
// cupo de una clase: el de su sala; las de baile usan el cupo de Baile en esa sucursal si está capturado (ej. Baile en Aura = 25)
function cupoClase(r,su,cfg){const b=isBaile(r.ta)?+(cfgOf("baile").cupos[su]||0):0;return b||+(cfg.cupos[su]||0)}
// semáforo de asistentes por clase: [amarillo desde, verde desde]; menos es rojo
const SEM_DEF=[10,15], SEM_ESP={"GOU|ft":[8,12],"GOU|neoride":[9,14]};
function semUmbral(area,su){const c=cfgOf(area).semaforo||{};return c[su]||SEM_ESP[su+"|"+area]||SEM_DEF}
function semArea(r){return salaArea(r.sa)||state.area}

function semRow(x){return semOf(x.r.c||0,semArea(x.r),x.su)}
function semCount(list){const o={ok:0,warn:0,bad:0};for(const x of list)o[semRow(x)]++;return o}
function semBar(o){const t=o.ok+o.warn+o.bad;if(!t)return"";return `<div class="sbar" title="${o.ok} verde · ${o.warn} amarillo · ${o.bad} rojo">`+["ok","warn","bad"].filter(k=>o[k]).map(k=>`<i class="g-${k}" style="width:${o[k]/t*100}%"></i>`).join("")+`</div>`}
// color del promedio de un grupo, solo si todas sus clases usan los mismos rangos
function semProm(list){if(!list.length)return"";const ks=new Set(list.map(x=>semArea(x.r)+"|"+x.su));if(ks.size!==1)return"";const [a,su]=[...ks][0].split("|");return semOf(list.reduce((t,x)=>t+(x.r.c||0),0)/list.length,a,su)}
function semLegend(list){
  const g={};for(const x of list){const a=semArea(x.r),u=semUmbral(a,x.su),k=u.join("-");const e=g[k]||(g[k]={u,who:new Set()});e.who.add(sucCorto(x.su)+" "+areaNombre(a))}
  const gs=Object.values(g);if(!gs.length)return"";
  return `<div class="semleg"><span>Semáforo por clase:</span>`+gs.map(e=>`<span>${gs.length>1?esc([...e.who].join(", "))+": ":""}<b class="t-bad">1–${e.u[0]-1}</b> · <b class="t-warn">${e.u[0]}–${e.u[1]-1}</b> · <b class="t-ok">${e.u[1]}+</b> asistentes</span>`).join("")+`</div>`;

function semTile(list){const o=semCount(list);return `<div class="kpi"><small>Semáforo de clases</small>${semBar(o)}<span><b class="t-ok">${o.ok}</b> verde · <b class="t-warn">${o.warn}</b> amarillo · <b class="t-bad">${o.bad}</b> rojo</span></div>`}
function cat(ta){const n=norm(ta);if(!n||n==="total")return"total";if(n.includes("bota"))return"botas";if(n.includes("estir"))return"estiramiento";return"otra"}
function computeRows(list,area){
  const cfg=cfgOf(area||state.area), qty=cfg.modo==="cantidad", prom=cfg.modo==="promedio", capf=cfg.modo==="capacidad";
  const by={};
  for(const x of list){const k=x.su+"|"+x.ini+"|"+x.fin+"|"+x.r.t;(by[k]=by[k]||{su:x.su,raw:x.r.t,ini:x.ini,fin:x.fin,rows:[]}).rows.push(x.r)}
  const cols={},recursos={},otros={},cache={};
  for(const g of Object.values(by)){
    const ck=g.su+"|"+g.raw;
    const res=cache[ck]||(cache[ck]=resolveName(g.raw,cfg,g.su)); if(res.kind==="skip")continue;
    const detail=g.rows.some(r=>cat(r.ta)!=="total");
    const use=detail?g.rows.filter(r=>cat(r.ta)!=="total"):g.rows;
    // n = clases impartidas (reporte de clases); cupo = lugares de la sala × clases
    const m={at:0,cap:0,estir:0,botas:0,agend:0,hasAgend:false,n:0,nv:0,cupo:0};
    for(const r of use){m.at+=r.c||0;if(r.a!=null){m.agend+=r.a;m.hasAgend=true}
      if(r.sa!=null){const cu=cupoClase(r,g.su,cfg);m.n++;if(r.v!==0)m.nv++;m.cupo+=cu;m.cap+=cu}else m.cap+=r.g||0;
      const k=cat(r.ta);if(k==="botas")m.botas+=r.c||0;else if(k==="estiramiento")m.estir+=r.c||0}
    if(res.kind==="col"){const t=cols[res.id]||(cols[res.id]={at:0,cap:0,estir:0,botas:0,agend:0,hasAgend:false,n:0,nv:0,cupo:0,fuentes:[],keys:[]});
      const who=(qty||prom||capf)?cfg.roster.find(r=>r.id===res.id):null, goal=who&&!capf?goalOf(who,cfg):null;
      // capacidad fija: capacidad semanal × semanas del periodo (una vez por periodo)
      if(capf){const pk=g.ini+"|"+g.fin;if(!t.keys.includes(pk)){t.keys.push(pk);t.cap+=g.ini&&g.fin?capPeriodo(who,cfg,g.ini,g.fin):m.cap}}
      else if(qty){const pk=g.ini+"|"+g.fin;if(!t.keys.includes(pk)){t.keys.push(pk);if(goal!=null)t.cap+=goal*monthFrac(g.ini,g.fin)}}
      else if(prom){if(goal!=null)t.cap+=goal*m.n}
      else t.cap+=m.cap;
      t.at+=m.at;t.estir+=m.estir;t.botas+=m.botas;t.agend+=m.agend;t.hasAgend=t.hasAgend||m.hasAgend;t.n+=m.n;t.nv+=m.nv;t.cupo+=m.cupo;
      if(!t.fuentes.includes(g.raw))t.fuentes.push(g.raw)}
    else{const bucket=res.kind==="recurso"?recursos:otros;const k=g.su+"|"+norm(g.raw);
      const t=bucket[k]||(bucket[k]={nombre:g.raw,su:g.su,at:0,cap:0});t.at+=m.at;t.cap+=m.cap}
  }
  return{cols,recursos,otros};
}
function metaOf(id,area){const cfg=cfgOf(area||state.area),c=cfg.roster.find(x=>x.id===id);
  if(cfg.modo==="capacidad")return c&&cfg.metaPct[c.turno]!=null?cfg.metaPct[c.turno]:(c?c.meta:0.9);
  if(cfg.modo!=="ocupacion")return 1;return c?c.meta:0.9}
function avgMeta(ids,area){const ms=ids.map(id=>metaOf(id,area));return ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:0.9}
// suma de un grupo; mc = Σ(capacidad × meta) para que la meta del grupo pese por capacidad
function sumFor(ids,cols,area){const o={at:0,cap:0,estir:0,botas:0,agend:0,hasAgend:false,mc:0,n:0,nv:0,cupo:0};
  for(const id of ids){const m=cols[id];if(!m)continue;o.at+=m.at;o.cap+=m.cap;o.estir+=m.estir;o.botas+=m.botas;o.agend+=m.agend;o.hasAgend=o.hasAgend||m.hasAgend;o.mc+=m.cap*metaOf(id,area);o.n+=m.n||0;o.nv+=m.nv||0;o.cupo+=m.cupo||0}
  return o}
// indicadores de clases
function promOf(m){return m&&m.n>0?m.at/m.n:null}
function aforoOf(m){return m&&m.cupo>0?m.at/m.cupo:null}
function fmt1(v){return v==null||!isFinite(v)?"–":v.toFixed(1)}
function ocup(m){return m&&m.cap>0?m.at/m.cap:null}
function cumpOf(m){return m&&m.mc>0?m.at/m.mc:null}
function metaEff(m,ids,area){return m&&m.cap>0?m.mc/m.cap:avgMeta(ids,area)}
function grade(c){if(c==null)return"empty";if(c>=1)return"ok";if(c>=0.9)return"warn";return"bad"}
function sortedPeriods(area){return state.periods.filter(p=>!area||(p.area||"recovery")===area).sort((a,b)=>a.inicio<b.inicio?-1:a.inicio>b.inicio?1:0)}
function isFullMonth(ini,fin){const [y,m]=ini.split("-").map(Number);return ini.slice(8)==="01"&&fin===iso(new Date(y,m,0))}
function colLabel(ini,fin){
  if(isFullMonth(ini,fin))return MESES[+ini.slice(5,7)-1].slice(0,3)+" "+ini.slice(2,4);
  return spanDays(ini,fin)<=7?fmtShort(ini):fmtShort(ini)+" "+ini.slice(2,4)+" – "+fmtShort(fin)+" "+fin.slice(2,4);

function overlapNote(){
  const suc=state.f.suc;
  const ps=sortedPeriods(state.area).filter(p=>suc==="all"||(p.sucursal||"NAC")===suc);
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
    const a=ps[i],b=ps[j];
    if((a.sucursal||"NAC")===(b.sucursal||"NAC")&&b.inicio<=a.fin)
      return `<div class="note">Hay periodos cargados que se enciman en ${esc(sucNombre(a.sucursal||"NAC"))} (${colLabel(a.inicio,a.fin)} y ${colLabel(b.inicio,b.fin)}). En Acumulado se suman los dos; elimina el que sobre en Cargar export.</div>`;
  }

// resumen de un área con los filtros vigentes (se recalcula en cada render)
let _stats={};
function areaStats(area){
  if(_stats[area])return _stats[area];
  const md0=cfgOf(area).modo, Z={at:0,cap:0,mc:0,n:0,nv:0,cupo:0};
  if(md0==="accesos"){const st=accStats(area);return _stats[area]={area,ros:[],accesos:true,st,m:Z,o:st.pct,c:st.c,con:0,enMeta:0,none:!st.dias.length}}
  if(md0==="ingresos"){const mes=capMesFor(area),t=ingTot(ingItems(area,mes));return _stats[area]={area,ros:[],ingresos:true,mes,t,m:Z,o:null,c:t.c,con:0,enMeta:0,none:!t.con.length}}
  if(md0==="cartera"){
    const mes=capMesFor(area), items=cartItems(area,mes).filter(x=>x.s&&x.s.n), ros=rosterSel({area});
    return _stats[area]={area,ros,cartera:true,mes,m:{at:0,cap:0,mc:0,n:0,nv:0,cupo:0},o:null,
      c:items.length?items.reduce((a,x)=>a+x.s.score,0)/items.length:null,con:items.length,enMeta:items.filter(x=>x.s.cumple).length,none:!items.length};
  }
  const rows=selRows({area}), ros=rosterSel({area}), ids=ros.map(r=>r.id);
  let s={area,ros,none:true};
  if(rows.length){
    const cols=computeRows(rows,area).cols, m=sumFor(ids,cols,area);
    const con=ros.filter(r=>cols[r.id]&&cols[r.id].cap>0);
    s={area,ros,rows,cols,m,o:ocup(m),c:cumpOf(m),con:con.length,
      enMeta:con.filter(r=>cumpOf(sumFor([r.id],cols,area))>=1).length,none:!m.cap&&!m.at};
  }
  return _stats[area]=s;
}

      if(x.s.ingresos)return{attr:`data-area="${x.a.id}"`,label:x.a.nombre,c:x.s.c,valSub:monthLabel(x.s.mes),sub:`${money(x.s.t.ing)} de ${money(x.s.t.meta)} sin IVA`};
      if(x.s.cartera)return{attr:`data-area="${x.a.id}"`,label:x.a.nombre,c:x.s.c,valSub:monthLabel(x.s.mes),sub:`${x.s.enMeta} de ${x.s.con} coaches cumplen cartera, rutina y activos`};
      return{attr:`data-area="${x.a.id}"`,label:x.a.nombre,c:x.s.c,o:x.s.o,at:x.s.m.at,ocupado:l.ocupado,valSub:l.qty?fmtN(x.s.m.at)+" de "+fmtN(x.s.m.cap):null,
        sub:`${fmtN(x.s.m.at)} ${esc(l.atl)} · ${x.s.enMeta} de ${x.s.con} ${l.personas} en meta`}});

    h+=conMeta.length?rankList(items)+LEGEND:sinMeta.length?"":`<p class="muted">Ningún ${grp==="estudios"?"estudio":"área"} tiene datos en esta selección.</p>`;
    if(sinMeta.length)h+=`<p class="section-label" style="margin-top:${conMeta.length?14:0}px">Sin meta todavía · promedio de asistentes por clase</p>`+

function rankingPanel(cols,roster){
  const l=L(), showSuc=state.f.suc==="all";

  let h=`<div class="panel"><div class="panel-head"><div><h2>Ranking vs meta</h2>
    <p>${l.prom?"Ordenado por cumplimiento: promedio de asistentes por clase ÷ meta por clase.":l.qty?"Ordenado por cumplimiento: "+esc(l.atl)+" ÷ meta mensual de su sucursal y turno.":"Ordenado por cumplimiento: "+l.ocup+" ÷ meta de cada quien."} La línea punteada es su meta.</p></div>
    <span class="tag ${enMeta?"ok":""}">${enMeta} de ${con.length} en meta</span></div>`;
  if(!con.length&&items.some(x=>x.m.n)){
    return `<div class="panel"><div class="panel-head"><div><h2>Ranking por promedio de asistentes</h2>
      <p>Todavía no hay meta ni cupo capturados; se ordena por promedio de asistentes por clase.</p></div></div>`+
      promList(items.filter(x=>x.m.n).map(x=>({attr:`data-colab="${esc(x.r.id)}"`,label:x.r.nombre,val:promOf(x.m),valSub:fmtN(x.m.n)+" clases",
        sub:`${showSuc?esc(sucCorto(x.r.sucursal))+" · ":""}${fmtN(x.m.at)} asistentes`})))+
      (sin.length>items.filter(x=>x.m.n).length?`<p class="muted small" style="margin:10px 0 0">Sin clases en este periodo: ${items.filter(x=>!x.m.n).map(x=>esc(x.r.nombre)).join(", ")}.</p>`:"")+`</div>`;
  }
  if(!con.length)return h+`<p class="muted">Nadie tiene capacidad registrada en esta selección.</p></div>`;
  h+=rankList(con.map(x=>({attr:`data-colab="${esc(x.r.id)}"`,label:x.r.nombre,c:x.c,o:x.o,at:x.m.at,ocupado:l.ocupado,
    sub:`${showSuc?esc(sucCorto(x.r.sucursal))+" · ":""}${TURNO_CORTO[x.r.turno]||esc(x.r.turno)} · meta ${esc(metaTxt(x.r))}`,valSub:l.prom?fmt1(promOf(x.m))+" por clase":l.qty?fmtN(x.m.at)+" "+esc(l.atl):null})));
  if(sin.length)h+=`<p class="muted small" style="margin:10px 0 0">Sin datos${l.qty?" o sin meta capturada":""} en este periodo: ${sin.map(x=>esc(x.r.nombre)).join(", ")}.</p>`;
  return h+LEGEND+`</div>`;
}

function vchart(series,meta){
  if(!series.length)return `<p class="muted">Sin datos para graficar.</p>`;
  const maxO=Math.max(...series.map(s=>s.o||0));
  const scale=Math.max(1,maxO*1.12,meta*1.15);
  const dense=series.length>16;
  return `<div class="scroll"><div class="vchart${dense?" dense":""}" style="--m:${meta/scale};min-width:${series.length*(dense?44:52)}px">
    <div class="vmeta"><span>Meta ${pct(meta)}</span></div>`+
    series.map(s=>{const g=grade(s.c);
      return `<div class="vcol" title="${esc(s.label)}: ${pct(s.o,1)} · ${fmtN(s.m.at)}/${fmtN(s.m.cap)}"><div class="vwrap"><i class="g-${g}" style="height:${(s.o||0)/scale*100}%"><span>${pct(s.o)}</span></i></div><div class="vlab">${esc(s.label)}</div></div>`}).join("")+
    `</div></div>`;
}

// horario del instructor: agrupado por día/hora/actividad con cada clase y su fecha, o clase por clase
function horarioPanel(mine,cfg,base,showSuc){

  }else{
    const slots={};

      Object.keys(slots).sort().map(k=>{const sl=slots[k],key=base+k,open=!!state.open[key];
        const list=sl.list.slice().sort((a,b)=>a.r.f<b.r.f?-1:1), shown=open||list.length<=MAXV?list:list.slice(-MAXV);
        return `<tr><td>${DIAS[sl.d]}</td><td>${esc(sl.h)}</td><td>${esc(sl.ta)}${showSuc?` <span class="tag">${esc(sucCorto(sl.su))}</span>`:""}</td>

function pendingClases(p){

    AREAS.filter(a=>by[a.id]).map(a=>{const x=by[a.id];

async function commitClases(p,force){
  const suc=p.sucursal||"NAC", asg=Object.fromEntries(Object.entries(p.salaAssign||{}).filter(([k,v])=>v));
  const groups={};

    if(!r.f)continue;
    const su=r.su||suc, w=iso(monday(parseISO(r.f))), fin=iso(addDays(parseISO(w),6));
    for(const a of classAreas(r,asg)){const k=a+"|"+su+"|"+w;(groups[k]=groups[k]||{area:a,su,inicio:w,fin,rows:[]}).rows.push(r)}
  }
  const list=Object.values(groups);
  if(!list.length){setStatus("No hay clases con fecha y sala para guardar");return}
  const existing=new Set(state.periods.map(x=>x.id));
  const clash=list.filter(x=>existing.has(periodId(x.area,x.su,x))).length;
  if(clash&&!force){p.clash=clash;render();return}
  setStatus("Guardando…");
  try{
    if(Object.keys(asg).length){const g=clone(state.global);Object.assign(g.salas,asg);await saveGlobal(g)}

    for(const x of list){

        cfgs[x.area]=cur;

    state.pending=null; render();

function metricValue(m,metric){
  if(!m||(!m.cap&&!m.at&&!m.n))return{txt:"",cls:"empty"};
  const o=ocup(m),c=cumpOf(m),g=grade(c);
  switch(metric||state.metric){
    case"prom":return{txt:fmt1(promOf(m)),cls:c!=null?g:"empty"};
    case"n":return{txt:String(m.n),cls:"empty"};
    case"aforo":return{txt:pct(aforoOf(m)),cls:c!=null?g:"empty"};
    case"at":return{txt:String(m.at),cls:g};
    case"cap":return{txt:String(m.cap),cls:"empty"};
    case"cump":return{txt:pct(c),cls:g};
    default:return{txt:pct(o),cls:g};
  }
}
function pizarraModel(){
  const by={};
  for(const x of selRows()){const k=x.ini+"|"+x.fin;(by[k]=by[k]||{ini:x.ini,fin:x.fin,list:[]}).list.push(x)}
  const columns=Object.values(by).sort((a,b)=>a.ini<b.ini?-1:a.ini>b.ini?1:(a.fin<b.fin?-1:1));
  columns.forEach(c=>{const r=computeRows(c.list);c.cols=r.cols;c.recursos=r.recursos});
  const months=[];
  for(const c of columns){const k=monthKey(c.ini);let g=months.find(m=>m.k===k);if(!g)months.push(g={k,items:[],list:[]});g.items.push(c);g.list.push(...c.list)}
  months.forEach(g=>{g.cols=computeRows(g.list).cols;g.solo=g.items.length===1&&isFullMonth(g.items[0].ini,g.items[0].fin)});
  return{columns,months};
}

function viewClases(rows){

  `<div class="row" style="margin-top:10px"><button class="btn ghost small" id="addCol">Agregar ${l.persona.toLowerCase()}</button></div></div>
  <div class="panel"><h2>Escalones de bono</h2><p class="muted" style="margin:2px 0 10px">Cumplimiento mínimo contra la meta (100% = llegó exacto a su meta) y cómo se llama el resultado.</p>

  cfg.tiers.map((t,i)=>`<tr><td><input class="inl" id="t${i}m" type="number" step="1" data-t="${i}" data-k="min" value="${Math.round(t.min*100)}"> %</td>

    extras.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v==="__recurso"?"Recurso":v==="__ignorar"?"Ignorado":esc((cfg.roster.find(r=>r.id===v)||{}).nombre||v)}</td><td><button class="btn ghost small" data-rmx="${esc(k)}">Olvidar</button></td></tr>`).join("")+

  h+=`<div class="row"><button class="btn" id="saveCfg" ${dirty?"":"disabled"}>Guardar cambios</button>${dirty?`<button class="btn ghost" id="undoCfg">Descartar cambios</button>`:""}</div>`;

}

/* ---------- export Excel (respeta área y filtros) ---------- */
async function exportExcel(){
  const {columns}=pizarraModel(); const groups=pizarraGroups(); const l=L(); const cfg=cfgOf(state.area);
  const wb=XLSX.utils.book_new();
  const aoa=[["Sucursal","Grupo","Indicador",...columns.map(c=>c.ini+" a "+c.fin)]];
  const push=(suc,name,ids)=>{const ms=columns.map(c=>sumFor(ids,c.cols));
    aoa.push([suc,name,l.at,...ms.map(m=>m.at)]);
    aoa.push([suc,name,l.cap,...ms.map(m=>m.cap)]);
    aoa.push([suc,name,l.ocup,...ms.map(m=>ocup(m)==null?"":+ocup(m).toFixed(4))]);
    aoa.push([suc,name,"Meta",...ms.map(m=>+metaEff(m,ids).toFixed(4))]);
    aoa.push([suc,name,"Cumplimiento",...ms.map(m=>cumpOf(m)==null?"":+cumpOf(m).toFixed(4))]);
  };
  for(const G of groups){
    for(const T of G.turnos){for(const id of T.ids)push(G.s.nombre,cfg.roster.find(r=>r.id===id).nombre,[id]);if(G.turnos.length>1)push(G.s.nombre,"T "+T.t,T.ids)}
    push(G.s.nombre,"Total "+G.s.corto,G.turnos.flatMap(t=>t.ids));
  }
  if(groups.length>1)push("Vivo 47","Vivo 47 total",groups.flatMap(G=>G.turnos.flatMap(t=>t.ids)));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Pizarra");
  const cols=computeRows(selRows()).cols;
  const rk=rosterSel().map(r=>{const m=sumFor([r.id],cols);return{r,m,o:ocup(m),c:cumpOf(m)}}).filter(x=>x.c!=null).sort((a,b)=>b.c-a.c);
  const ra=[["Posición",l.persona,"Sucursal","Turno",l.at,l.cap,"% ocupación","Meta","Cumplimiento"]];
  rk.forEach((x,i)=>ra.push([i+1,x.r.nombre,sucNombre(x.r.sucursal),x.r.turno,x.m.at,x.m.cap,+x.o.toFixed(4),l.qty?goalOf(x.r,cfg):x.r.meta,+x.c.toFixed(4)]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ra),"Ranking");
  const ar=[["Periodo","Sucursal","Recurso","Usos","Capacidad","Ocupación"]];
  for(const c of columns)for(const m of Object.values(c.recursos))ar.push([c.ini+" a "+c.fin,sucNombre(m.su),m.nombre,m.at,m.cap,m.cap?+(m.at/m.cap).toFixed(4):""]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ar),"Recursos");
  const br=[["Mes",l.persona,"Sucursal","Turno",l.at,l.cap,"% ocupación","Meta","Cumplimiento","Resultado"]];
  for(const k of dateOptions().mes)for(const x of bonoRows(k).list)
    br.push([monthLabel(k),x.r.nombre,sucNombre(x.r.sucursal),x.r.turno,x.m.at,x.m.cap,x.o==null?"":+x.o.toFixed(4),l.qty?goalOf(x.r,cfg):x.r.meta,x.c==null?"":+x.c.toFixed(4),x.m.cap?(x.t?x.t.etiqueta:"No alcanza"):"Sin datos"]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(br),"Bonos");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const tag=state.f.suc==="all"?"Vivo47":sucCorto(state.f.suc);
  const an=norm(areaNombre(state.area)).replace(/[^a-z0-9]+/g,"_");
  try{await state.downloads.save({filename:"Pizarra_"+an+"_"+tag+".xlsx",data:new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});setStatus("Excel descargado")}
  catch(e){setStatus(e.code==="declined"?"Descarga cancelada":"No se pudo descargar: "+(e.message||e.code))}
}

/* ---------- eventos ---------- */
function setArea(a){
  if(a!=="resumen"&&!areaById(a))return;
  state.area=a; state.navOpen=false; state.confirmDel=null; state.colab=null;
  lsSet(LS_A,a);
  render(); window.scrollTo({top:0});
}
async function handleFile(file){
  if(!file)return;
  setStatus("Leyendo "+file.name+"…");
  try{state.pending=await readFile(file)}catch(e){state.pending={fileName:file.name,area:state.area==="resumen"?"deportes":state.area,error:"No pude abrir el archivo: "+e.message}}
  idleStatus();
  if(state.area!=="resumen")state.tab="cargar";
  render(); if(state.area==="resumen")window.scrollTo({top:0});
}
// cada fila va a su semana (Fecha) o a su rango (Fecha de inicio / fin); el resto al periodo capturado
function fileRanges(p){
  const by={}, rest=[];
  for(const r of p.rows){
    if(r.f){const w=iso(monday(parseISO(r.f)));const k=w+"|"+iso(addDays(parseISO(w),6));(by[k]=by[k]||[]).push(r)}
    else if(r.pi&&r.pf){const k=r.pi+"|"+r.pf;(by[k]=by[k]||[]).push(r)}
    else rest.push(r);
  }
  const periods=Object.entries(by).map(([k,rows])=>{const [inicio,fin]=k.split("|");return{inicio,fin,rows}});
  if(!periods.length||(!p.hasFecha&&rest.some(r=>norm(r.t)!=="total"))){
    const ini=p.inicio, fin=p.fin;
    if(!ini||!fin||fin<ini)return null;
    const same=periods.find(x=>x.inicio===ini&&x.fin===fin);
    if(same)same.rows=same.rows.concat(rest);else periods.push({inicio:ini,fin,rows:rest});
  }
  return periods;
}
function periodId(area,suc,x){return "p_"+area+"_"+suc+"_"+x.inicio+"_"+x.fin}
// ids de antes de tener áreas (solo Recovery)
function legacyIds(area,suc,x){return area!=="recovery"?[]:["p_"+suc+"_"+x.inicio+"_"+x.fin].concat(suc==="NAC"?["p_"+x.inicio+"_"+x.fin]:[])}
async function commitMulti(p,force){
  const suc=p.sucursal||"NAC";
  const periods=fileRanges(p); if(!periods){setStatus("Revisa las fechas del periodo");return}
  const assigns=Object.entries(p.assign||{}).filter(([k,v])=>v);
  const targets=new Set();
  for(const r of p.rows){const res=routeName(r.t,r.su||suc);if(res.area)targets.add(res.area)}
  for(const [k,v] of assigns){if(v.startsWith("area:"))targets.add(v.slice(5));if(v==="__recurso")targets.add("recovery")}
  const existing=new Set(state.periods.map(x=>x.id));
  let clash=0;
  for(const a of targets)for(const x of periods)if(existing.has(periodId(a,suc,x))||legacyIds(a,suc,x).some(id=>existing.has(id)))clash++;
  if(clash&&!force){p.clash=clash;render();return}
  setStatus("Guardando…");
  try{
    // nombres nuevos → equipo de su área; "no contar nunca" → lista general
    const names={};for(const x of pendingFacts(p)){const k=norm(x.r.t);if(!names[k])names[k]={nombre:x.r.t,su:x.su}}
    const cfgs={}; let g=null;
    assigns.forEach(([k,v],i)=>{
      if(v==="__ignorar"){g=g||clone(state.global);g.extra[k]="__ignorar"}
      else if(v==="__recurso"){const c=cfgs.recovery||(cfgs.recovery=clone(cfgOf("recovery")));c.extra[k]="__recurso"}
      else if(v.startsWith("area:")){const a=v.slice(5), nm=names[k]||{nombre:k,su:suc};
        const c=cfgs[a]||(cfgs[a]=clone(cfgOf(a)));
        c.roster.push({id:"c"+Date.now().toString(36)+i,nombre:titleCase(nm.nombre),sucursal:nm.su,turno:"MAT",meta:c.metaDef,alias:[k]})}
    });
    for(const [a,c] of Object.entries(cfgs))await saveConfig(c,a);
    if(g)await saveGlobal(g);
    let n=0;
    for(const a of AREAS)for(const x of periods){
      const rows=x.rows.filter(r=>routeName(r.t,r.su||suc).area===a.id);
      if(!rows.length)continue;
      for(const lg of legacyIds(a.id,suc,x))if(existing.has(lg))await deletePeriod(lg);
      await savePeriod({id:periodId(a.id,suc,x),area:a.id,sucursal:suc,inicio:x.inicio,fin:x.fin,archivo:p.fileName,cargado:new Date().toISOString(),rows});n++;
    }
    state.pending=null;
    if(state.f.suc!=="all"&&state.f.suc!==suc){state.f.suc=suc;saveF()}
    render(); setStatus(n+" periodo"+(n===1?"":"s")+" guardado"+(n===1?"":"s")+" en "+new Set([...targets]).size+" áreas");
  }catch(e){setStatus("No se pudo guardar: "+(e.message||e.code))}
}
async function commitPending(force){
  const p=state.pending; if(!p||p.error)return;
  if(p.area==="deportes")return p.clases?commitClases(p,force):commitMulti(p,force);
  const suc=p.sucursal||"NAC", area=p.area;
  const periods=fileRanges(p); if(!periods){setStatus("Revisa las fechas del periodo");return}
  const idOf=x=>periodId(area,suc,x);
  const legacy=x=>legacyIds(area,suc,x);
  const existing=new Set(state.periods.map(x=>x.id));
  const clash=periods.filter(x=>existing.has(idOf(x))||legacy(x).some(id=>existing.has(id)));
  if(clash.length&&!force){p.clash=clash.length;render();return}
  setStatus("Guardando…");
  try{
    const assigns=Object.entries(p.assign||{}).filter(([k,v])=>v);
    if(assigns.length){
      const cfg=clone(cfgOf(area)); const nombres={};
      for(const x of Object.values(computeRows(pendingFacts(p),area).otros))nombres[norm(x.nombre)]=x.nombre;
      assigns.forEach(([k,v],i)=>{
        if(v==="__nuevo"){
          const id="c"+Date.now().toString(36)+i;
          cfg.roster.push({id,nombre:titleCase(nombres[k]||k),sucursal:suc,turno:"MAT",meta:cfg.metaDef,alias:[k]});
        }else cfg.extra[k]=v;
      });
      await saveConfig(cfg,area);
    }
    for(const x of periods){
      for(const lg of legacy(x))if(existing.has(lg))await deletePeriod(lg);
      await savePeriod({id:idOf(x),area,sucursal:suc,inicio:x.inicio,fin:x.fin,archivo:p.fileName,cargado:new Date().toISOString(),rows:x.rows});
    }
    state.pending=null; state.tab="tablero";
    if(state.f.suc!=="all"&&state.f.suc!==suc){state.f.suc=suc;saveF()}
    idleStatus(); render();
  }catch(e){setStatus("No se pudo guardar: "+(e.message||e.code))}
}
function editCfg(fn){
  if(!state.dirty||state.dirty.area!==state.area)state.dirty={area:state.area,cfg:clone(cfgOf(state.area))};
  fn(state.dirty.cfg);
}
function stepValor(d){
  const f=state.f, list=dateOptions()[f.rango]||[], i=list.indexOf(f.valor[f.rango]), j=i+d;
  if(j>=0&&j<list.length){f.valor[f.rango]=list[j];saveF();render()}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-tab],#drop"); if(!t)return;
  const d=t.dataset;
  if(d.area!=null){setArea(d.area);return}
  if(d.nav){state.navOpen=!state.navOpen;renderSide();return}
  if(d.tab){state.tab=d.tab;render();return}
  if(d.go){state.tab=d.go;render();return}
  if(d.fsuc!=null){state.f.suc=d.fsuc;saveF();render();return}
  if(d.fturno!=null){state.f.turno=d.fturno;saveF();render();return}
  if(d.frango!=null){state.f.rango=d.frango;saveF();render();return}
  if(d.slot!=null){state.open[d.slot]=!state.open[d.slot];render();return}
  if(d.hclear!=null){state.f.hDesde="";state.f.hHasta="";saveF();render();return}
  if(d.fvalid!=null){state.f.valid=d.fvalid==="1";saveF();render();return}
  if(d.fstep!=null){stepValor(+d.fstep);return}
  if(d.colab!=null){const e=cfgOf(state.area).roster.find(x=>x.id===d.colab);state.colab=d.colab;state.colabSuc=e?e.sucursal:"all";state.tab="colaborador";render();window.scrollTo({top:0});return}
  if(d.csuc!=null){state.colabSuc=d.csuc;render();return}
  if(d.hview!=null){state.hview=d.hview;render();return}
  if(d.colabarea!=null){const [a,id]=d.colabarea.split("|");if(!areaById(a))return;state.area=a;lsSet(LS_A,a);state.tab="colaborador";state.colab=id;state.colabSuc="all";render();window.scrollTo({top:0});return}
  if(t.id==="drop"){document.getElementById("file").click();return}
  if(t.id==="ai"){aiOrganize();return}
  if(t.id==="savePending"){commitPending(false);return}
  if(t.id==="replacePending"){commitPending(true);return}
  if(t.id==="cancelPending"){state.pending=null;render();return}
  if(t.id==="allNew"&&state.pending){const p=state.pending;
    for(const x of Object.values(computeRows(pendingFacts(p),p.area).otros)){const k=norm(x.nombre);if(!p.assign[k])p.assign[k]="__nuevo"}
    render();return}
  if(t.id==="export"){exportExcel();return}
  if(d.rmg){const g=clone(state.global);delete g.extra[d.rmg];saveGlobal(g).catch(err=>setStatus("No se pudo guardar: "+(err.message||err.code)));return}
  if(d.askdel){state.confirmDel=d.askdel;render();return}
  if(d.nodel){state.confirmDel=null;render();return}
  if(d.del){state.confirmDel=null;deletePeriod(d.del).catch(err=>setStatus("No se pudo eliminar: "+(err.message||err.code)));return}
  if(d.metric){state.metric=d.metric;render();return}
  if(t.id==="addCol"){editCfg(c=>c.roster.push({id:"c"+Date.now().toString(36),nombre:"Nuevo",sucursal:state.f.suc!=="all"?state.f.suc:"NAC",turno:"MAT",meta:c.metaDef,alias:[]}));render();return}
  if(d.rm){editCfg(c=>c.roster.splice(+d.rm,1));render();return}
  if(t.id==="saveCap"&&state.capDirty){const x=state.capDirty;state.capDirty=null;saveCaptura(x.area,x.mes,x.datos).then(()=>setStatus("Captura guardada")).catch(err=>setStatus("No se pudo guardar: "+(err.message||err.code)));return}
  if(t.id==="undoCap"){state.capDirty=null;render();return}
  if(t.id==="saveDia"&&state.diaDirty){const x=state.diaDirty;state.diaDirty=null;saveDiario(x.mes,x.dias).then(()=>setStatus("Registro guardado")).catch(err=>setStatus("No se pudo guardar: "+(err.message||err.code)));return}
  if(t.id==="undoDia"){state.diaDirty=null;render();return}
  if(t.id==="applyMeta"){editCfg(c=>c.roster.forEach(r=>r.meta=c.metaDef));render();return}
  if(t.id==="addTier"){editCfg(c=>c.tiers.push({min:0.9,etiqueta:"Nuevo escalón"}));render();return}
  if(d.rmt){editCfg(c=>c.tiers.splice(+d.rmt,1));render();return}
  if(d.rmx){editCfg(c=>{delete c.extra[d.rmx]});render();return}
  if(t.id==="saveCfg"&&state.dirty){const x=state.dirty;state.dirty=null;saveConfig(x.cfg,x.area).catch(err=>setStatus("No se pudo guardar: "+(err.message||err.code)));return}
  if(t.id==="undoCfg"){state.dirty=null;render();return}
});
document.addEventListener("keydown",e=>{if(e.target.id==="drop"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();document.getElementById("file").click()}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="file"){handleFile(t.files[0]);t.value="";return}
  if(t.id==="hDesde"||t.id==="hHasta"){state.f[t.id]=t.value;saveF();render();return}
  if(t.id==="fDesde"||t.id==="fHasta"){const p=(state.f.valor.fechas||"|").split("|");if(t.id==="fDesde")p[0]=t.value;else p[1]=t.value;
    if(p[0]&&p[1]){state.f.valor.fechas=p.join("|");saveF();render()}return}
  if(t.id==="fval"){state.f.valor[state.f.rango]=t.value;saveF();render();return}
  if(t.id==="colSel"){state.colab=t.value;state.colabSuc="all";render();return}
  if(t.id==="bonoSel"){state.bonoMonth=t.value;render();return}
  if(t.id==="pSuc"&&state.pending){state.pending.sucursal=t.value;state.pending.sucAuto=false;state.pending.clash=0;render();return}
  if(t.id==="pIni"&&state.pending){state.pending.inicio=t.value;state.pending.clash=0;return}
  if(t.id==="pFin"&&state.pending){state.pending.fin=t.value;state.pending.clash=0;return}
  if(t.dataset.assign!=null&&state.pending){state.pending.assign[t.dataset.assign]=t.value;return}
  if(t.dataset.sala!=null&&state.pending){const p=state.pending;p.salaAssign=p.salaAssign||{};p.salaAssign[t.dataset.sala]=t.value;p.clash=0;render();return}
  if(t.dataset.r!=null){const i=+t.dataset.r,k=t.dataset.k;editCfg(c=>{const r=c.roster[i];
    if(k==="meta")r.meta=Math.max(0,num(t.value))/100;
    else if(k==="capSem"||k==="horasFin"){if(t.value.trim()==="")delete r[k];else r[k]=Math.max(0,num(t.value))}
    else if(k==="jornada"||k==="descanso"){if(t.value==="")delete r[k];else r[k]=t.value}
    else if(k==="metaN"){if(t.value.trim()==="")delete r.metaN;else r.metaN=Math.max(0,num(t.value))}
    else if(k==="alias")r.alias=t.value.split(",").map(s=>s.trim()).filter(Boolean);else r[k]=t.value});render();return}
  if(t.dataset.cfg!=null){const k=t.dataset.cfg;editCfg(c=>{c[k]=t.value.trim();if(k==="modo"&&c.modo==="cantidad"&&!c.unidad)c.unidad="completadas"});render();return}
  if(t.dataset.metadef!=null){editCfg(c=>{c.metaDef=Math.max(0,num(t.value))/100});render();return}
  if(t.dataset.sem!=null){const [k,i]=t.dataset.sem.split("|");editCfg(c=>{const cur=(c.semaforo[k]||SEM_ESP[k+"|"+state.area]||SEM_DEF).slice();cur[+i]=Math.max(0,num(t.value));c.semaforo[k]=cur});render();return}
  if(t.dataset.capdef!=null){editCfg(c=>{c.capDef=Math.max(0,num(t.value))});render();return}
  if(t.dataset.metapct!=null){const k=t.dataset.metapct;editCfg(c=>{c.metaPct=Object.assign({},c.metaPct);c.metaPct[k]=Math.max(0,num(t.value))/100});render();return}
  if(t.dataset.kpi!=null){const k=t.dataset.kpi;editCfg(c=>{c.kpi=Object.assign({},c.kpi);c.kpi[k]=(k==="rutina"||k==="activos")?Math.max(0,num(t.value))/100:Math.max(0,num(t.value))});render();return}
  if(t.dataset.cap!=null){const [id,campo]=t.dataset.cap.split("|"),mes=capMesFor(state.area);
    if(!state.capDirty||state.capDirty.area!==state.area||state.capDirty.mes!==mes)state.capDirty={area:state.area,mes,datos:clone(capOf(state.area,mes))};
    const d=state.capDirty.datos[id]=state.capDirty.datos[id]||{};if(t.value.trim()==="")delete d[campo];else d[campo]=Math.max(0,num(t.value));render();return}
  if(t.id==="capMesSel"){state.capMes=t.value;state.capDirty=null;state.diaDirty=null;render();return}
  if(t.dataset.dia!=null){const [d,campo,su]=t.dataset.dia.split("|"),mes=d.slice(0,7);
    if(!state.diaDirty||state.diaDirty.mes!==mes)state.diaDirty={mes,dias:clone((state.diario[mes]||{}).dias||{})};
    const day=state.diaDirty.dias[d]=state.diaDirty.dias[d]||{}, o=day[campo]=day[campo]||{};
    if(t.value.trim()==="")delete o[su];else o[su]=Math.max(0,num(t.value));render();return}
  if(t.dataset.metaacc!=null){editCfg(c=>{c.metaAcc=Math.max(0,num(t.value))/100});render();return}
  if(t.dataset.metaing!=null){editCfg(c=>{c.metaIng=Math.max(0,num(t.value))});render();return}
  if(t.dataset.pf!=null){const g=clone(state.global);g.pctFuerza=Object.assign({},g.pctFuerza);g.pctFuerza[t.dataset.pf]=Math.max(0,num(t.value))/100;saveGlobal(g).catch(err=>setStatus("No se pudo guardar: "+(err.message||err.code)));return}
  if(t.dataset.cupo!=null){const k=t.dataset.cupo;editCfg(c=>{if(t.value.trim()==="")delete c.cupos[k];else c.cupos[k]=Math.max(0,num(t.value))});render();return}
  if(t.dataset.baile!=null){const g=clone(state.global);g.baile=t.value.split(",").map(x=>x.trim()).filter(Boolean);saveGlobal(g).catch(err=>setStatus("No se pudo guardar: "+(err.message||err.code)));return}
  if(t.dataset.mt!=null){const k=t.dataset.mt;editCfg(c=>{if(t.value.trim()==="")delete c.metasTurno[k];else c.metasTurno[k]=Math.max(0,num(t.value))});render();return}
  if(t.dataset.t!=null){const i=+t.dataset.t,k=t.dataset.k;editCfg(c=>{c.tiers[i][k]=k==="min"?num(t.value)/100:t.value});render();return}
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();handleFile(e.dataTransfer.files[0])}});

render();
connect();
})();
</script>
</body>
</html>
